name: Time expiry

# A failure here means: recheck the named masjid's times. GitHub emails the failure.
on:
  schedule:
    - cron: "17 13 * * *" # 8:17 AM in Tampa during winter
  workflow_dispatch:

permissions:
  contents: read

jobs:
  expiry:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/check-expiry.mjs
