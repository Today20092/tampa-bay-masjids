<!doctype html>
<!-- PROTOTYPE, throwaway. Question: how should the phone home page look? Three variants (#A, #B, #C). Sample times only. -->
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PROTOTYPE: Tampa Bay Masjids</title>
<style>
  *{box-sizing:border-box} body{margin:0;font-family:var(--font-sans,system-ui,sans-serif)}
  .wrap{max-width:390px;margin:0 auto}
  .switch{display:flex;gap:6px;margin-bottom:8px}
  .switch button{flex:1;padding:10px 4px;border:1px solid var(--border,#999);border-radius:999px;background:transparent;color:var(--foreground,#111);font:600 13px inherit;cursor:pointer}
  .switch button[aria-pressed=true]{background:var(--foreground,#111);color:var(--background,#fff)}
  .note{font-size:12px;color:var(--muted-foreground,#666);margin:0 0 8px;text-align:center}
  .phone{height:720px;overflow:auto;border:1px solid var(--border,#999);border-radius:24px;background:#f7f5ee;color:#17251f;font-size:14px}
  .phone button,.phone input{font:inherit;color:inherit}
  header{padding:16px;background:#14513f;color:#fff}
  header h1{margin:0 0 10px;font-size:20px}
  .fb{display:block;text-align:center;padding:10px;border-radius:10px;background:#e8c766;color:#17251f;font-weight:700;text-decoration:none}
  .sample{background:#fde2b8;color:#5b3200;text-align:center;font-weight:700;font-size:12px;padding:5px}
  main{padding:12px}
  input[type=search]{width:100%;padding:11px 12px;border:1px solid #c9c4b3;border-radius:10px;background:#fff;margin-bottom:12px}
  .card{background:#fff;border:1px solid #e2ddcc;border-radius:14px;padding:12px;margin-bottom:10px}
  .card.pin{border:2px solid #14513f}
  .top{display:flex;justify-content:space-between;gap:8px}
  h2{font-size:15px;margin:0}
  .ar{font-size:14px;color:#14513f} .sub{font-size:12px;color:#5d6a63}
  .big{text-align:right;white-space:nowrap} .big b{display:block;font-size:22px;line-height:1.1}
  .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin:10px 0 4px;text-align:center}
  .grid div{background:#eef3ef;border-radius:8px;padding:6px 0;font-size:12px} .grid div.next{background:#14513f;color:#fff}
  .grid b{display:block;font-size:14px}
  .acts{display:flex;gap:6px;margin-top:10px}
  .acts a,.acts button{flex:1;min-height:40px;display:flex;align-items:center;justify-content:center;border:1px solid #c9c4b3;border-radius:10px;background:#fff;color:#17251f;text-decoration:none;font-size:13px;font-weight:600;cursor:pointer}
  .acts a.go{background:#14513f;border-color:#14513f;color:#fff}
  .sub a{color:#14513f}
  .check{color:#8a4b00;font-weight:600;font-size:13px}
  .chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px}
  .chips button{padding:9px 14px;border:1px solid #c9c4b3;border-radius:999px;background:#fff;white-space:nowrap;cursor:pointer}
  .chips button[aria-pressed=true]{background:#14513f;color:#fff}
  .row{border-bottom:1px solid #e2ddcc;padding:10px 0}
  .row>button{display:flex;gap:12px;align-items:center;width:100%;border:0;background:none;text-align:left;padding:0;cursor:pointer}
  .time{width:78px;font-size:20px;font-weight:700;flex:none} .time.none{font-size:12px;color:#8a4b00}
  table{width:100%;border-collapse:collapse;font-size:12px;background:#fff}
  th,td{padding:9px 2px;border-bottom:1px solid #e2ddcc;text-align:center} th{position:sticky;top:0;background:#eef3ef}
  td:first-child,th:first-child{text-align:left;padding-left:8px}
  td button{border:0;background:none;padding:0;text-align:left;font-weight:700;cursor:pointer}
  th.next,td.next{background:#d9eae1;font-weight:700} tr.pin td:first-child{box-shadow:inset 4px 0 #14513f}
  tr.open td{background:#fff;padding:0 8px 10px}
  footer{padding:4px 12px 20px;text-align:center} footer p{font-size:13px} footer a.report{color:#14513f;font-weight:700}
</style>
<div class="wrap">
  <div class="switch" id="switch"></div>
  <p class="note" id="note"></p>
  <div class="phone">
    <header><h1>Tampa Bay Masjids</h1><a class="fb" href="https://www.facebook.com/groups/tampabaymuslims" target="_blank" rel="noopener">Join our Facebook group</a></header>
    <div class="sample">SAMPLE TIMES. Not real. Do not use.</div>
    <main>
      <input type="search" id="q" placeholder="Search masjid or area" aria-label="Search masjid or area">
      <div id="view"></div>
    </main>
    <footer>
      <p><a class="report" href="#" onclick="return false">Report a wrong time</a></p>
      <a class="fb" href="https://www.facebook.com/groups/tampabaymuslims" target="_blank" rel="noopener">Join our Facebook group</a>
    </footer>
  </div>
</div>
<script>
const P=['Fajr','Dhuhr','Asr','Maghrib','Isha'], NEXT=2;
// [name, arabic, area, address, 5 sample iqama times or null, sample jumuah or null]
const M=[
 ['Al-Qassam','مسجد القسام','North Tampa','5905 East 130th Avenue, Tampa, FL',['6:10','1:30','4:15','5:45','7:30'],'1:15 · 2:30'],
 ['ISTABA','','East Tampa','7326 East Sligh Avenue, Tampa, FL 33610',['6:15','1:00','4:00','5:44','7:15'],'1:30'],
 ['TMC','','Temple Terrace area','8080 N 56th St, Tampa, FL 33617',['6:20','1:15','4:30','5:45','7:45'],'12:35 · 1:35'],
 ['Omar','مسجد عمر','Busch Blvd','4801 East Busch Boulevard, Tampa, FL 33617',null,null],
 ['Abu Bakr','مسجد أبو بكر','North 30th St','11010 North 30th Street, Tampa, FL 33612',null,null],
 ['Darussalam','دار السلام','Thonotosassa','15830 Morris Bridge Road, Thonotosassa, FL 33592',['6:15','1:00','4:20','5:40','8:00'],'1:15 · 2:25'],
 ['IC of Wesley Chapel','','Lutz','19130 Livingston Avenue, Lutz, FL 33559',['5:55','12:30','3:25','5:44','7:05'],'12:15'],
 ['An-Noor','مسجد النور','Wesley Chapel','2250 Ashley Oaks Circle, Wesley Chapel, FL 33544',null,null],
 ['USF Jumu‘ah','','USF Marshall Center','4103 USF Cedar Cir, Tampa, FL 33620',null,'1:30']
];
const V={A:['Cards','Your masjid on top, everything visible.'],B:['Next prayer','Pick a prayer, see who prays when.'],C:['Table','Like the spreadsheet: compare all at once.']};
let v=V[location.hash.slice(1)]?location.hash.slice(1):'A', pin=0, open=null, tab=NEXT;
const $=id=>document.getElementById(id);
const list=()=>{const q=$('q').value.toLowerCase();return M.map((m,i)=>({m,i})).filter(({m})=>(m[0]+m[1]+m[2]).toLowerCase().includes(q)).sort((a,b)=>(b.i===pin)-(a.i===pin))};
const name=(m,i)=>`<h2>${i===pin?'📌 ':''}${m[0]}</h2>${m[1]?`<div class="ar" lang="ar" dir="rtl" style="text-align:left">${m[1]}</div>`:''}<div class="sub">${m[2]}</div>`;
const acts=(m,i)=>`<div class="acts"><a class="go" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(m[3])}">Directions</a><a href="#" onclick="return false">WhatsApp</a><button data-pin="${i}" aria-pressed="${i===pin}">${i===pin?'Pinned':'Pin'}</button></div>`;
const grid=m=>`<div class="grid">${P.map((p,k)=>`<div class="${k===NEXT?'next':''}">${p.slice(0,5)}<b>${m[4][k]}</b></div>`).join('')}</div>`;
const meta=m=>m[4]||m[5]?`<div class="sub">${m[5]?`Jumu‘ah <b>${m[5]}</b> · `:''}Checked Nov 24</div>`:'';
const detail=(m,i)=>`${m[4]?grid(m):'<p class="check">Check with the masjid</p>'}${meta(m)}${acts(m,i)}<div class="sub" style="margin-top:8px"><a href="#" onclick="return false">Website and details</a></div>`;
function render(){
  $('switch').innerHTML=Object.keys(V).map(k=>`<button data-v="${k}" aria-pressed="${k===v}">${k}. ${V[k][0]}</button>`).join('');
  $('note').textContent=V[v][1];
  const L=list(); let h='';
  if(v==='A') h=L.map(({m,i})=>`<section class="card ${i===pin?'pin':''}"><div class="top"><div>${name(m,i)}</div>${m[4]?`<div class="big"><span class="sub">Asr iqama</span><b>${m[4][NEXT]}</b></div>`:''}</div>${i===pin&&m[4]?grid(m):''}${m[4]?'':'<p class="check">Check with the masjid</p>'}${meta(m)}${acts(m,i)}<div class="sub" style="margin-top:8px"><a href="#" onclick="return false">All times and website</a></div></section>`).join('');
  if(v==='B'){
    const t=m=>tab<5?m[4]&&m[4][tab]:m[5];
    const mins=s=>{let[h,mm]=s.split(' ')[0].split(':').map(Number);if(tab&&h<11)h+=12;return h*60+mm};
    L.sort((a,b)=>(b.i===pin)-(a.i===pin)||(!t(a.m))-(!t(b.m))||(t(a.m)?mins(t(a.m))-mins(t(b.m)):0));
    h=`<div class="chips">${[...P,'Jumu‘ah'].map((p,k)=>`<button data-tab="${k}" aria-pressed="${k===tab}">${p}${k===NEXT?' · next':''}</button>`).join('')}</div>`+
      L.map(({m,i})=>`<div class="row"><button data-open="${i}" aria-expanded="${open===i}"><span class="time ${t(m)?'':'none'}">${t(m)?t(m).split(' · ').join('<br>'):'Check with masjid'}</span><span style="flex:1">${name(m,i)}</span><span aria-hidden="true">${open===i?'▴':'▾'}</span></button>${open===i?detail(m,i):''}</div>`).join('');
  }
  if(v==='C') h=`<table><thead><tr><th>Masjid</th>${P.map((p,k)=>`<th class="${k===NEXT?'next':''}">${p.slice(0,4)}</th>`).join('')}</tr></thead><tbody>${L.map(({m,i})=>`<tr class="${i===pin?'pin':''}"><td><button data-open="${i}" aria-expanded="${open===i}">${m[0]}</button></td>${m[4]?m[4].map((x,k)=>`<td class="${k===NEXT?'next':''}">${x}</td>`).join(''):`<td colspan="5" class="check" style="font-size:12px">${m[5]?'Jumu‘ah only':'Check with the masjid'}</td>`}</tr>${open===i?`<tr class="open"><td colspan="6"><div class="sub" style="padding-top:8px">${m[2]}</div>${meta(m)}${acts(m,i)}</td></tr>`:''}`).join('')}</tbody></table><p class="sub">Tap a name for Jumu‘ah, directions and WhatsApp.</p>`;
  $('view').innerHTML=L.length?h:'<p>No masjid matches that search.</p>';
}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
  if(d.v){v=d.v;open=null}else if(d.pin)pin=+d.pin;else if(d.tab)tab=+d.tab;else if(d.open)open=open===+d.open?null:+d.open;render()});
$('q').addEventListener('input',render);
render();
console.assert(M.length===9,'nine masjids');
</script>
</html>
